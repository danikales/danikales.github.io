<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite-api@5.6.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-tooltip"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
    <link rel="stylesheet" href="style.css" />
    <script>
      const options = {
        config: {
          // Vega-Lite default configuration
        },
        init: (view) => {
          // initialize tooltip handler
          view.tooltip(new vegaTooltip.Handler().call);
        },
        view: {
          // view constructor options
          // remove the loader if you don't want to default to vega-datasets!
          loader: vega.loader({
            baseURL: "https://cdn.jsdelivr.net/npm/vega-datasets@2/",
          }),
          renderer: "canvas",
        },
      };

      // register vega and vega-lite with the API
      vl.register(vega, vegaLite, options);
    </script>
    <style></style>
  </head>
  <body>
    
    <div class="container">
      <!-- visualization goes into this div you can create multiple divs and give them IDs -->
    <h2>Global sales by Platform</h2>
    <div id="view"></div>

    <h2>Global sales by Genre</h2>
    <div id="view2"></div>

    <h2>Sales overtime by Platform</h2>
    <div id="view3"></div>

    <h2>Sales overtime by Genre</h2>
    <div id="view4"></div>

    <h2>Regional Sales vs Platform</h2>
    <div id="view5"></div>

    <h2>Regional Sales vs Platform</h2>
    <div id="view6"></div>

    <h2>Nintendo sales in Japan over the years</h2>
    <div id="view7"></div>

    <h2>Monopoly game sales amount over different platforms</h2>
    <div id="view8"></div>
    </div>
    <script type="module" src="vis.js"></script>
  </body>
</html>
